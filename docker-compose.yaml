version: "3.1"

services:
  backend:
    build:
      dockerfile: backend.Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mariadb
      - migrator
    healthcheck:
      test: [ "CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:80/api/v2" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      my_network:
        aliases:
          - backend

  webserver:
    image: my_php_apache:latest
    build:
      context: ./
      dockerfile: php.Dockerfile
    container_name: webserver
    environment:
      - MYSQL_PASSWORD=pass
      - MYSQL_USERNAME=root
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:80" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # - ./www/:/var/www/html/
      # - ./.env:/var/www/html/.env
      - ./logs/:/var/log/
      - ./backups/:/var/www/html/backups/
    depends_on:
      - mariadb
      - migrator
    networks:
      my_network:
        aliases:
          - webserver

  cron-worker:
    image: my_php_apache:latest
    build:
      context: ./
      dockerfile: php.Dockerfile
    container_name: cron-worker
    environment:
      - MYSQL_PASSWORD=pass
      - MYSQL_USERNAME=root
    command: ["cron", "-f"]
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./logs/:/var/log/
      - ./backups/:/var/www/html/backups/
    depends_on:
      - mariadb
      - migrator
    networks:
      my_network:
        aliases:
          - cron-worker

  mariadb:
    build:
      context: ./
      dockerfile: mariadb.Dockerfile
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MARIADB_DATABASE=j_tasks
    volumes:
      - ./database:/var/lib/mysql
      # - ./j_tasks.sql:/docker-entrypoint-initdb.d/j_tasks.sql
      # healthcheck:
      #   test: ["CMD-SHELL", "mysqladmin ping -P 3306 -p$$MARIADB_ROOT_PASSWORD | grep 'mysqld is alive' || exit 1"]
      #   interval: 2s
      #   retries: 120
    networks:
      my_network:
        aliases:
          - mariadb
    ports:
      - "3306:3306"

  migrator:
    build:
      context: ./
      dockerfile: migrator.Dockerfile
    container_name: migrator
    restart: "no"
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - mariadb
    networks:
      - my_network
    # Mount host migrations so devs don't need to rebuild the image
    volumes:
      - ./migrations:/migrations:ro

  phpmyadmin:
    image: linuxserver/phpmyadmin
    restart: always
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 10M
      PMA_ABSOLUTE_URI: http://localhost/phpmyadmin/
    healthcheck:
      test: [ "CMD", "curl", "-Ss", "http://localhost/robots.txt" ]
      start_period: 5s
      interval: 3s
      timeout: 60s
      retries: 10
    depends_on:
      - mariadb
      - migrator
    networks:
      my_network:
        aliases:
          - phpmyadmin

  nginx:
    # image: nginx
    depends_on:
      - webserver
      - phpmyadmin
      - backend
      - migrator
    build:
      context: ./
      dockerfile: nginx.Dockerfile

    restart: always
    networks:
      - my_network
    ports:
      - "80:80"
      - "443:443"
      # environment:
      #   - WEBSERVER_HOST=${WEBSERVER_HOST}
      #   - PHPMYADMIN_HOST=${PHPMYADMIN_HOST}
      # volumes:
      # - ./configs/nginx.conf:/etc/nginx/nginx.conf
      # - ./certs/:/etc/nginx/certs/
      # - ./.htpasswd:/etc/nginx/.htpasswd
      # - ./404.html:/etc/nginx/404.html
      # depends_on:
      #   - webserver
      #   - phpmyadmin

networks:
  my_network:
